[package]
name = "panorama_injetados"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
iced = "0.14.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
